name: Daily Tasks Cron Backup

on:
  schedule:
    # Runs every day at midnight UTC (0:00) - Backup for Vercel cron
    - cron: '0 0 * * *'

  # Allows manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  daily-tasks:
    runs-on: ubuntu-latest

    steps:
      - name: Run daily tasks (subscriptions + fraud monitoring)
        run: |
          response=$(curl -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            ${{ secrets.APP_URL }}/api/cron/daily-tasks)

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -ne 200 ]; then
            echo "Error: Cron job failed with status $http_code"
            exit 1
          fi

          echo "Cron job completed successfully"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Daily tasks cron job failed. Check the logs above for details."
